<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#438d35">
  <meta
    name="description"
    content="Answers to common MyFarmBox Singapore questions about harvests, ordering and delivery."
  >
  <title>Member Questions — MyFarmBox Singapore</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="stylesheet" href="/shared.css?v=22">

  <style>
    :root {
      --faq-green: #438d35;
      --faq-ink: #1f3422;
      --faq-muted: #617064;
      --faq-soft: #f5f8f3;
    }

    .faq-page {
      padding: clamp(54px, 8vw, 100px) 20px 100px;
      background: linear-gradient(180deg, #f5f8f3 0, #ffffff 410px);
      min-height: 70vh;
    }

    .faq-shell {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .faq-intro {
      max-width: 650px;
      margin: 0 auto;
      text-align: center;
    }

    .faq-eyebrow {
      margin: 0 0 10px;
      color: var(--faq-green);
      font: 700 0.72rem/1.2 "DM Sans", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .faq-intro h1 {
      margin: 0;
      color: var(--faq-ink);
      font: 800 clamp(2rem, 5vw, 3.6rem)/1.08 "Manrope", sans-serif;
      letter-spacing: -0.045em;
    }

    .faq-intro > p:last-child {
      margin: 18px auto 0;
      color: var(--faq-muted);
      font: 400 1rem/1.7 "DM Sans", sans-serif;
    }

    .faq-filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin: 40px 0 28px;
    }

    .faq-filter {
      border: 1px solid rgba(31, 52, 34, 0.14);
      border-radius: 999px;
      background: #fff;
      color: #49604c;
      cursor: pointer;
      padding: 9px 15px;
      font: 700 0.82rem/1 "DM Sans", sans-serif;
      transition: 160ms ease;
    }

    .faq-filter:hover,
    .faq-filter.is-active {
      border-color: var(--faq-green);
      background: var(--faq-green);
      color: #fff;
    }

    .faq-results {
      display: grid;
      gap: 12px;
    }

    .faq-item {
      overflow: hidden;
      border: 1px solid rgba(32, 63, 35, 0.12);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(28, 59, 31, 0.05);
    }

    .faq-question {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border: 0;
      background: transparent;
      color: var(--faq-ink);
      cursor: pointer;
      padding: 21px 22px;
      font: 700 1rem/1.45 "DM Sans", sans-serif;
      text-align: left;
    }

    .faq-question:hover {
      color: var(--faq-green);
    }

    .faq-icon {
      flex: 0 0 auto;
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border: 1px solid rgba(67, 141, 53, 0.32);
      border-radius: 50%;
      color: var(--faq-green);
      font-size: 1.25rem;
      line-height: 1;
      transition: 180ms ease;
    }

    .faq-item.is-open .faq-icon {
      transform: rotate(45deg);
      background: var(--faq-green);
      color: #fff;
    }

    .faq-answer {
      display: none;
      padding: 0 22px 22px;
      color: var(--faq-muted);
      font: 400 0.97rem/1.7 "DM Sans", sans-serif;
      white-space: pre-line;
    }

    .faq-item.is-open .faq-answer {
      display: block;
    }

    .faq-media-link {
      display: inline-flex;
      margin-top: 15px;
      color: var(--faq-green);
      font-weight: 700;
      text-decoration: none;
    }

    .faq-media-link:hover {
      text-decoration: underline;
    }

    .faq-empty,
    .faq-loading {
      padding: 46px 20px;
      color: var(--faq-muted);
      text-align: center;
      font: 400 1rem/1.6 "DM Sans", sans-serif;
    }

    .faq-help {
      margin-top: 42px;
      padding: 28px;
      border-radius: 22px;
      background: var(--faq-ink);
      color: #fff;
      text-align: center;
    }

    .faq-help h2 {
      margin: 0;
      font: 700 1.25rem/1.3 "Manrope", sans-serif;
    }

    .faq-help p {
      margin: 9px 0 18px;
      color: rgba(255,255,255,.74);
      font: 400 .94rem/1.55 "DM Sans", sans-serif;
    }

    .faq-help a {
      display: inline-flex;
      border-radius: 999px;
      background: #fff;
      color: var(--faq-ink);
      padding: 11px 18px;
      font: 700 .88rem/1 "DM Sans", sans-serif;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .faq-page {
        padding-inline: 16px;
      }

      .faq-question {
        padding: 18px;
        font-size: .96rem;
      }

      .faq-answer {
        padding: 0 18px 18px;
      }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="faq-page">
    <div class="faq-shell">
      <header class="faq-intro">
        <p class="faq-eyebrow">Member questions</p>
        <h1>Answers for your family’s harvest.</h1>
        <p>
          Everything you may want to know about 100% Natural Produce,
          ordering and Sunday delivery.
        </p>
      </header>

      <nav class="faq-filters" id="faq-filters" aria-label="FAQ categories"></nav>

      <section class="faq-results" id="faq-results" aria-live="polite">
        <p class="faq-loading">Loading member questions…</p>
      </section>

      <section class="faq-help">
        <h2>Still have a question?</h2>
        <p>Our team is happy to help with your family’s harvest.</p>
        <a
          href="https://wa.me/6589582110?text=Hi%20MyFarmBox%20Singapore%2C%20I%20have%20a%20question%20about%20my%20harvest."
          target="_blank"
          rel="noopener"
        >
          Chat on WhatsApp
        </a>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/shared.js?v=20"></script>

  <script>
    (() => {
      const FAQ_API_URL =
        'https://script.google.com/macros/s/AKfycbx-lzPKRyzFoyuAhLT510wdZJPeugL419f4u19rgYUd-zEz-nA9YcHoYWoejvBSWnQ49w/exec?action=faqs';

      const results = document.getElementById('faq-results');
      const filters = document.getElementById('faq-filters');
      const storageKey = 'mfbsg-all-faqs-v1';
      const cacheMinutes = 60;
      let allFaqs = [];
      let activeCategory = 'All';

      function getSavedFaqs() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
          if (!saved || !Array.isArray(saved.faqs)) return null;

          return {
            faqs: saved.faqs,
            fresh: Date.now() - saved.savedAt < cacheMinutes * 60 * 1000
          };
        } catch (error) {
          return null;
        }
      }

      function saveFaqs(faqs) {
        try {
          localStorage.setItem(
            storageKey,
            JSON.stringify({ faqs: faqs, savedAt: Date.now() })
          );
        } catch (error) {}
      }

      function renderFilters() {
        const categories = [
          'All',
          ...new Set(allFaqs.map(faq => faq.category).filter(Boolean))
        ];

        filters.innerHTML = '';

        categories.forEach(category => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'faq-filter';
          button.textContent = category;

          if (category === activeCategory) {
            button.classList.add('is-active');
          }

          button.addEventListener('click', () => {
            activeCategory = category;
            renderFilters();
            renderFaqs();
          });

          filters.appendChild(button);
        });
      }

      function renderFaqs() {
        const visibleFaqs = activeCategory === 'All'
          ? allFaqs
          : allFaqs.filter(faq => faq.category === activeCategory);

        results.innerHTML = '';

        if (!visibleFaqs.length) {
          results.innerHTML =
            '<p class="faq-empty">No questions are available in this category yet.</p>';
          return;
        }

        visibleFaqs.forEach((faq, index) => {
          const item = document.createElement('article');
          item.className = 'faq-item';

          const question = document.createElement('button');
          question.type = 'button';
          question.className = 'faq-question';
          question.setAttribute('aria-expanded', 'false');
          question.setAttribute('aria-controls', `faq-answer-${index}`);

          const questionText = document.createElement('span');
          questionText.textContent = faq.question;

          const icon = document.createElement('span');
          icon.className = 'faq-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = '+';

          const answer = document.createElement('div');
          answer.className = 'faq-answer';
          answer.id = `faq-answer-${index}`;
          answer.hidden = true;

          const answerText = document.createElement('div');
          answerText.textContent = faq.answer;
          answer.appendChild(answerText);

          if (faq.mediaUrl) {
            const mediaLink = document.createElement('a');
            mediaLink.className = 'faq-media-link';
            mediaLink.href = faq.mediaUrl;
            mediaLink.target = '_blank';
            mediaLink.rel = 'noopener';
            mediaLink.textContent = 'View supporting photo or video →';
            answer.appendChild(mediaLink);
          }

          question.append(questionText, icon);

          question.addEventListener('click', () => {
            const isOpen = item.classList.toggle('is-open');
            question.setAttribute('aria-expanded', String(isOpen));
            answer.hidden = !isOpen;
          });

          item.append(question, answer);
          results.appendChild(item);
        });
      }

      function showFaqs(faqs) {
        allFaqs = faqs
          .filter(faq => faq.active)
          .sort((a, b) => a.displayOrder - b.displayOrder);

        renderFilters();
        renderFaqs();
      }

      async function refreshFaqs() {
        try {
          const response = await fetch(FAQ_API_URL, { cache: 'no-store' });
          const data = await response.json();

          if (!data.ok || !Array.isArray(data.faqs)) {
            throw new Error('FAQ data was not returned.');
          }

          saveFaqs(data.faqs);
          showFaqs(data.faqs);
        } catch (error) {
          if (!allFaqs.length) {
            results.innerHTML =
              '<p class="faq-empty">Questions are unavailable right now. Please try again shortly.</p>';
          }
        }
      }

      const saved = getSavedFaqs();

      if (saved) {
        showFaqs(saved.faqs);
      }
      
      refreshFaqs();
    })();
  </script>
</body>
</html>
